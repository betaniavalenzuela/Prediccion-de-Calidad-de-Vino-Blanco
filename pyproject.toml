[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "prediccion_de_la_calidad_del_vino_blanco"
version = "0.0.1"
description = "prediccion de la calidad del vino blanco a partir de sus propiedades fisicoquimicas"
authors = [
  { name = "Betania Valenzuela" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["prediccion_de_la_calidad_del_vino_blanco"]
include = ["pyproject.toml", "prediccion_de_la_calidad_del_vino_blanco/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["prediccion_de_la_calidad_del_vino_blanco"]
force-sort-within-sections = true

